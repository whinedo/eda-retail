# Migraciones del esquema. db/init/001_schema.sql crea el esquema base al crear el
# volumen; Alembic aplica los cambios posteriores:  uv run alembic upgrade head
# La URL sale de las variables de entorno (ver src/eda_retail/config.py).
[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
