# Infraestructura local de la PoC: Kafka (KRaft, un solo broker) y PostgreSQL.
# Arranque:  docker compose up -d
# Parada:    docker compose down          (conserva los datos)
# Reinicio limpio: docker compose down -v (borra los volúmenes)

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: eda-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: other containers (kafka:19092). EXTERNAL: host processes (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: eda-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic eda.events --partitions 3 --replication-factor 1 --config retention.ms=-1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic eda.dlq --partitions 1 --replication-factor 1 --config retention.ms=-1

  postgres:
    image: postgres:16
    container_name: eda-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eda}
      POSTGRES_DB: ${POSTGRES_DB:-eda}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eda} -d ${POSTGRES_DB:-eda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Trazas de OpenTelemetry: OTLP en 4317 (gRPC) y 4318 (HTTP), interfaz en http://localhost:16686
  # Almacenamiento en memoria: las trazas se pierden al reiniciar el contenedor.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    container_name: eda-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  kafka_data:
  postgres_data:
