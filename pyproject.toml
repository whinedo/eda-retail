[project]
name = "eda-retail"
version = "0.1.0"
description = "PoC académica de EDA con agentes para incidencias logísticas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
eda-relay = "eda_retail.infra.relay:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_retail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL and Kafka from docker compose"]
