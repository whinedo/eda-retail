[project]
name = "eda-retail"
version = "0.1.0"
description = "PoC académica de EDA con agentes para incidencias logísticas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "alembic>=1.20.1",
    "confluent-kafka>=2.5",
    "fastapi>=0.115",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.30",
]

[project.scripts]
eda-projector = "eda_retail.projectors.cli:main"
eda-event-log = "eda_retail.event_log.cli:main"
eda-intake = "eda_retail.intake.cli:main"
eda-interpreter = "eda_retail.interpreter.cli:main"
eda-inventory = "eda_retail.inventory.cli:main"
eda-planner = "eda_retail.planner.cli:main"
eda-replanner = "eda_retail.replanner.cli:main"
eda-step-executor = "eda_retail.step_executors.cli:main"
eda-experiment = "eda_retail.experiments.cli:main"
eda-orchestrator = "eda_retail.orchestrator.cli:main"
eda-notice = "eda_retail.synthetic.cli:main"
eda-web = "eda_retail.web.cli:main"
eda-carrier-agent = "eda_retail.carrier_agent.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_retail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL and Kafka from docker compose",
    "slow: runs a whole experiment through the harness",
]

[tool.ruff]
line-length = 120
target-version = "py312"
