[project]
name = "eda-retail"
version = "0.1.0"
description = "PoC académica de EDA con agentes para incidencias logísticas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "confluent-kafka>=2.5",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
eda-relay = "eda_retail.infra.relay:main"
eda-agent = "eda_retail.agents.cli:main"
eda-projector = "eda_retail.projectors.cli:main"
eda-experiment = "eda_retail.experiments.cli:main"
eda-orchestrator = "eda_retail.orchestrator.cli:main"
eda-executor = "eda_retail.executors.cli:main"
eda-notice = "eda_retail.synthetic.cli:main"

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "ruff>=0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_retail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL and Kafka from docker compose",
    "slow: runs a whole experiment through the harness",
]

[tool.ruff]
line-length = 120
target-version = "py312"
