# Required check for merging to main: `checks`, which passes only when the hygiene job (pre-commit: hygiene, ruff,
# web) and every pytest shard pass. pytest runs against real PostgreSQL and Kafka (docker compose) and always uses
# the fake LLM client: no Ollama in CI.
#
# The pytest suite runs in parallel shards, each with its own PostgreSQL and Kafka, so the run stays under the job
# timeout. The shards are disjoint and together cover every test:
#   fast    -m "not slow"                          (unit and integration tests that are not whole experiments)
#   slow-a  -m slow on SLOW_A                      (the experiment files listed below)
#   slow-b  -m slow, ignoring SLOW_A               (every other slow test, wherever it lives)
# Every shard prints its slowest tests (--durations) to rebalance SLOW_A when needed. The shard commands mirror the
# local pytest hook of .pre-commit-config.yaml (`uv run pytest -q`): keep them in sync.
name: checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SLOW_A: >-
    tests/integration/test_experiments.py
    tests/integration/test_e23_business_duplicates.py
    tests/integration/test_e11_late_results.py
    tests/integration/test_e6_compare.py
    tests/integration/test_e17_parked.py
    tests/integration/test_e14_burst_backpressure.py
    tests/integration/test_e15_llm_degradation.py
    tests/integration/test_e19_topic_loss.py

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar Python y dependencias
        run: |
          uv python install 3.12
          uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias del front
        run: npm ci --prefix web

      - name: Run pre-commit (hygiene, ruff, web; pytest runs in the shards)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: pytest

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [fast, slow-a, slow-b]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar Python y dependencias
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Levantar PostgreSQL y Kafka
        run: docker compose up -d --wait postgres kafka

      - name: pytest (${{ matrix.shard }})
        run: |
          case "${{ matrix.shard }}" in
            fast)   uv run pytest -q -m "not slow" --durations=15 ;;
            slow-a) uv run pytest -q -m slow --durations=15 $SLOW_A ;;
            slow-b) uv run pytest -q -m slow --durations=15 $(printf -- '--ignore=%s ' $SLOW_A) ;;
          esac

      - name: Logs de los servicios
        if: failure()
        run: docker compose logs --no-color postgres kafka

  checks:
    if: ${{ !cancelled() }}  # a run superseded by a newer push is cancelled, not failed
    needs: [hygiene, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos los jobs en verde
        run: |
          test "${{ needs.hygiene.result }}" = success
          test "${{ needs.tests.result }}" = success
