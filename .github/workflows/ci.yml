# Required check for merging to main: `checks`, which passes only when the hygiene job (pre-commit: hygiene, ruff,
# web) and every pytest shard pass. pytest runs against real PostgreSQL and Kafka (docker compose) and always uses
# the fake LLM client: no Ollama in CI.
#
# The pytest suite runs in parallel shards, each with its own PostgreSQL and Kafka, so the run stays under the job
# timeout. The shards are disjoint and together cover every test:
#   fast    -m "not slow"                          (unit and integration tests that are not whole experiments)
#   slow-a  -m slow on SLOW_A                      (the experiment files listed below)
#   slow-c  -m slow on SLOW_C                      (the experiment files listed below)
#   slow-d  -m slow on SLOW_D                      (E8, and E10, which stops and pauses its shard's PostgreSQL)
#   slow-b  -m slow, ignoring SLOW_A, SLOW_C and SLOW_D (every other slow test, wherever it lives)
# A file is listed in only one of SLOW_A, SLOW_C and SLOW_D. Every shard prints its slowest tests (--durations) to
# rebalance them when needed. slow-d dumps every thread's stack if a test (fixture setup included) runs past
# 9 min (faulthandler_timeout), to see where a hung test is stuck. The slow shards run pytest -v, one line per test, so a shard cut by the timeout still
# shows which test was running. The pytest step has its own timeout, below the job's, so the service logs are
# printed even then. The shard commands mirror the local pytest hook of .pre-commit-config.yaml (`uv run pytest -q`):
# keep the selection in sync.
# A pull request that only changes documentation (docs/, specs/, odd/ or any .md file) runs hygiene and fast but skips
# the slow shards, which read none of those files; they still report success, so `checks` passes. push runs only on
# main: a PR's branch is already tested by its pull_request run.
name: checks

on:
  push:
    branches: [main]  # a PR already runs on pull_request: pushing to its branch would run everything twice
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SLOW_A: >-
    tests/integration/test_experiments.py
    tests/integration/test_e23_business_duplicates.py
    tests/integration/test_e11_late_results.py
    tests/integration/test_e6_compare.py
    tests/integration/test_e17_parked.py
    tests/integration/test_e14_burst_backpressure.py
    tests/integration/test_e13_compensation_failure.py
  SLOW_C: >-
    tests/integration/test_e19_topic_loss.py
    tests/integration/test_e15_llm_degradation.py
    tests/integration/test_e20_v2_dependencies.py
    tests/integration/test_multiprocess_components.py
  SLOW_D: >-
    tests/integration/test_e8_crash_matrix.py
    tests/integration/test_e10_postgres_down.py

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar Python y dependencias
        run: |
          uv python install 3.12
          uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias del front
        run: npm ci --prefix web

      - name: Run pre-commit (hygiene, ruff, web; pytest runs in the shards)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: pytest

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [fast, slow-a, slow-b, slow-c, slow-d]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the docs-only check below diffs against the PR base

      - name: Alcance del cambio
        id: scope
        # A PR that only touches documentation (docs/, specs/, odd/ or any .md) skips the slow shards: no slow test
        # reads those files. fast always runs (it checks docs/README.md). push and workflow_dispatch run everything.
        run: |
          code=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
            echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(docs|specs|odd)/|\.md$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Shard saltado (solo documentación)
        if: matrix.shard != 'fast' && steps.scope.outputs.code == 'false'
        run: echo "El PR solo cambia documentación; ${{ matrix.shard }} no se ejecuta."

      - uses: astral-sh/setup-uv@v6
        if: matrix.shard == 'fast' || steps.scope.outputs.code == 'true'
        with:
          enable-cache: true

      - name: Instalar Python y dependencias
        if: matrix.shard == 'fast' || steps.scope.outputs.code == 'true'
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Levantar PostgreSQL y Kafka
        if: matrix.shard == 'fast' || steps.scope.outputs.code == 'true'
        run: docker compose up -d --wait postgres kafka

      - name: pytest (${{ matrix.shard }})
        if: matrix.shard == 'fast' || steps.scope.outputs.code == 'true'
        timeout-minutes: 18  # below the job's 20, so the service logs below are still printed
        run: |
          case "${{ matrix.shard }}" in
            fast)   uv run pytest -q -m "not slow" --durations=15 ;;
            slow-a) uv run pytest -v -m slow --durations=15 $SLOW_A ;;
            slow-b) uv run pytest -v -m slow --durations=15 $(printf -- '--ignore=%s ' $SLOW_A $SLOW_C $SLOW_D) ;;
            slow-c) uv run pytest -v -m slow --durations=15 $SLOW_C ;;
            slow-d) uv run pytest -v -m slow --durations=15 -o faulthandler_timeout=540 $SLOW_D ;;
          esac

      - name: Logs de los servicios
        if: failure() || cancelled()
        run: docker compose logs --no-color postgres kafka

  checks:
    if: ${{ !cancelled() }}  # a run superseded by a newer push is cancelled, not failed
    needs: [hygiene, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos los jobs en verde
        run: |
          test "${{ needs.hygiene.result }}" = success
          test "${{ needs.tests.result }}" = success
