# Same checks as the required CI job: run before closing a feature with
#   uv run pre-commit run --all-files
# pytest needs PostgreSQL and Kafka from `docker compose up -d`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false

      - id: web
        name: web (vitest + tsc)
        entry: bash -c 'cd web && npm test && npm run typecheck'
        language: system
        files: ^web/
        pass_filenames: false
